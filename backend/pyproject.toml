[project]
name = "trade-research-platform-backend"
version = "0.2.0"
description = "Platform backend built beside the trade-research toolkit"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "BLE"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares injection in argument defaults by design -- Depends for
# dependencies, and Query/Header/Path for request parameters. All four are
# constructed once at import and never mutated, which is what B008 guards.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
