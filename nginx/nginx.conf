# Single entry point for the DEVELOPMENT stack: the UI at /, the API at /api/,
# health passthrough at /health so a supervisor can probe through the proxy.
#
# Plain HTTP on port 80 and that is correct for this file -- it is published on
# 127.0.0.1:8080 and never faces a network. The production configuration is
# `nginx.prod.conf`, which terminates TLS; see DEPLOYMENT_ARCHITECTURE.md for
# why they are two files rather than one with a flag.

# Rate limit zones. Defined here rather than per-location because an nginx
# `limit_req_zone` is a shared-memory allocation and must live at http scope.
# These are a SECOND layer in front of the application's own limiter, not a
# replacement: the app's limits are per user and per email, which nginx cannot
# see, and nginx's are per address, which the app should not have to care about.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# 5 r/s SUSTAINED is the right ceiling for TradingView -- one alert per
# signal, and anything sustained above that is a retry storm or somebody
# else. The BURST is what a legitimate multi-symbol strategy needs: one
# firing across 30 symbols at a bar close arrives as 30 simultaneous
# alerts, and burst=10 dropped 14 of 25 in a measured test. Those are real
# trading signals, and dropping them is a correctness problem even though
# it fails closed.
#
# The application's own limiter (120/60s per address) does the fine-grained
# work; this zone exists to stop a flood reaching the app at all.
limit_req_zone $binary_remote_addr zone=webhook:10m rate=5r/s;

# Cap concurrent connections per address so one client cannot exhaust worker
# slots. The WebSocket cap in the application is per USER; this is per address
# and catches an unauthenticated flood before it reaches the app at all.
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Rate-limited requests answer 429, NOT nginx's default 503.
#
# Found by load testing at L48, and it matters more here than in most
# applications. L40 established that **TradingView retries on 5xx**: a 503 tells
# the sender "the server is broken, try again", so the proxy's own rate limit
# would trigger exactly the retry storm the webhook gateway exists to absorb.
#
# 429 is the truth -- "you are going too fast" -- and a well-behaved sender
# backs off instead of hammering. The application's own limiter already answers
# 429 with a Retry-After header; this makes the proxy agree with it rather than
# contradict it.
limit_req_status 429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 64 KB matches the webhook gateway's own body cap. Rejecting an oversized
    # body here means it never occupies an application worker.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # nginx does not announce its version to the internet.
    server_tokens off;

    limit_conn perip 64;

    # The TradingView webhook, before the general /api/ block so it wins.
    #
    # A tighter rate than the rest of the API: TradingView sends one alert per
    # signal, and a burst is either a retry storm or somebody else. `burst=10
    # nodelay` absorbs a legitimate retry without queueing, and the application
    # still applies its own 120/60s per-address limit behind this.
    location /api/v1/webhooks/ {
        limit_req zone=webhook burst=60 nodelay;
        proxy_pass http://api:8000/v1/webhooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A webhook is a small POST that either succeeds quickly or should be
        # retried by the sender. Long timeouts here hold a worker open for a
        # caller that has already given up.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        limit_req zone=api burst=200 nodelay;
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ------------------------------------------------------------------
        # WebSocket upgrade. THIS WAS MISSING and it was a real defect: the
        # realtime socket is served at `/v1/realtime/ws`, which reaches the API
        # through this block, and without `Upgrade`/`Connection` nginx strips
        # the handshake and answers the HTTP request instead. Every live update
        # in the platform -- orders, positions, notifications, health -- is
        # dead behind the proxy without these two lines.
        #
        # It was invisible because the API is also published directly on
        # 127.0.0.1:8000 for development, and that is the address a developer
        # connects to. Found by the L41 audit, not by a failure.
        # ------------------------------------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A socket that sends nothing for 60s is not idle -- the application
        # pings every 20s and closes after three missed intervals, so anything
        # quiet for longer than that is already gone. Set above the app's own
        # timeout so the app decides, not the proxy.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location /health {
        # Deliberately not rate limited: a health probe that gets 429 under load
        # reports the service as down at exactly the moment it is busiest.
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
