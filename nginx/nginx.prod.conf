# PRODUCTION entry point. TLS terminates here; everything behind it is private.
#
# A separate file from `nginx.conf` rather than one file with a flag, and that
# is the decision worth explaining: a config that switches TLS on a variable
# has a code path in which TLS is off, and that path is reachable by a typo in
# an environment file. Two files means the production config CANNOT serve plain
# HTTP on the application port, because it has no `listen 80` for it.
#
# Certificates are mounted, never baked. `certbot renew` or whatever the
# deployment uses writes to the mounted path and `nginx -s reload` picks them
# up; nothing here fetches or generates one, and nothing here disables
# verification.

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# 5 r/s SUSTAINED is the right ceiling for TradingView -- one alert per
# signal, and anything sustained above that is a retry storm or somebody
# else. The BURST is what a legitimate multi-symbol strategy needs: one
# firing across 30 symbols at a bar close arrives as 30 simultaneous
# alerts, and burst=10 dropped 14 of 25 in a measured test. Those are real
# trading signals, and dropping them is a correctness problem even though
# it fails closed.
#
# The application's own limiter (120/60s per address) does the fine-grained
# work; this zone exists to stop a flood reaching the app at all.
limit_req_zone $binary_remote_addr zone=webhook:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Rate-limited requests answer 429, NOT nginx's default 503.
#
# Found by load testing at L48, and it matters more here than in most
# applications. L40 established that **TradingView retries on 5xx**: a 503 tells
# the sender "the server is broken, try again", so the proxy's own rate limit
# would trigger exactly the retry storm the webhook gateway exists to absorb.
#
# 429 is the truth -- "you are going too fast" -- and a well-behaved sender
# backs off instead of hammering. The application's own limiter already answers
# 429 with a Retry-After header; this makes the proxy agree with it rather than
# contradict it.
limit_req_status 429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80 exists ONLY to redirect and to answer the ACME challenge. It proxies
# nothing: a plain-HTTP path to the API is a plain-HTTP path to a session
# cookie, whatever the redirect says.
server {
    listen 80;
    server_name ${TR_SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${TR_SERVER_NAME};

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.2 and 1.3 only. 1.0 and 1.1 are not "old", they are broken, and a
    # trading platform has no client that needs them.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn perip 64;

    # HSTS is sent by the API on its own responses in production (see
    # app/security/headers.py) and here for the pages nginx serves itself.
    # `always` so it is present on error responses too.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/v1/webhooks/ {
        limit_req zone=webhook burst=60 nodelay;
        proxy_pass http://api:8000/v1/webhooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        limit_req zone=api burst=200 nodelay;
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto is https here, which is what makes the application's
        # `Secure` cookie and its production HSTS correct behind a proxy.
        proxy_set_header X-Forwarded-Proto $scheme;

        # The WebSocket upgrade. Same defect, same fix as the development file.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Liveness and readiness, for an external monitor. `/health/trading` is
    # deliberately included: it reveals a verdict and a count and never the
    # reasons, which is why it is safe to expose and the monitoring summary is
    # not.
    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
