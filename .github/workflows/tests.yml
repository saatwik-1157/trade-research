# The claims this project rests on are that the numbers are computed, that a
# report cannot state one the data layer never produced, and that the cache
# sweep deletes only what is dead. All three are checked by scripts that need
# no network and no API keys, so all three run here on every push rather than
# depending on someone remembering to run them.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor claimed in requirements.txt; running it here is what
        # makes that claim true rather than asserted. 3.14 is what development
        # actually happens on.
        python-version: ["3.10", "3.12", "3.14"]

    name: test (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Indicator computations
        run: python tests/test_indicators.py

      - name: Sourcing gate
        run: python tests/test_verify.py

      - name: Cache pruning
        run: python tests/test_cache.py

      - name: SEC period alignment
        run: python tests/test_edgar.py

      - name: Rule backtest and order fill mode
        run: python tests/test_rule_backtest.py

      - name: Swap units, night count and plausibility fence
        run: python tests/test_swap.py

      # The carry verdict is the only positive number on this account, so the
      # way it fails is by getting more confident than the data allows. Judged
      # on one window it reads CARRY_EXCEEDS_DRIFT for a pair that is negative
      # five years further back; the test pins the hedged verdict and the
      # seventy-five-year horizon that makes it moot.
      - name: Carry against spot drift, across windows
        run: python tests/test_carry_check.py

      # A cross-sectional search is the one construction where a lookahead is
      # both easy to introduce and profitable-looking: an off-by-one that
      # contaminates 1/k of the signal scored an in-sample t of 2.47, clearing
      # both Bonferroni and the permutation null. The test asserts the signal
      # algebra directly rather than hoping a t-statistic notices.
      - name: Cross-sectional portfolios, lookahead and neutrality
        run: python tests/test_cross_search.py

      # The autopsy reads 900+ live trades and its failure mode is being too
      # encouraging. A DEAL_REASON guessed rather than read put the harvest's
      # +297 under the stop loss's name; the permutation test has to be able
      # to say no as well as yes; and cost attribution has to use a quantity
      # measured independently of the outcomes it explains.
      - name: Live-trade autopsy - enum, null and cost attribution
        run: python tests/test_trade_autopsy.py

      # simulate_exit produces published numbers, and two exits added on
      # 2026-09-23 can restate them silently: sl_atr=None removes the stop
      # entirely, and profit_exit closes at the first NET-positive bar. The
      # finding they measure is that closing at the first profit captures the
      # spread and nothing more, so an edit that made it capture upside would
      # quietly erase the comparison.
      - name: Exit simulator - no-stop path and profit exit
        run: python tests/test_exit_search.py

      # A day-of-week study falls into the weekend: the Friday-to-Monday
      # return spans three calendar days against every other return's one,
      # and the first version of calendar_search also labelled it with the
      # day it starts from. Together those produced a "Friday effect" that
      # cleared a permutation null and was mostly exposure.
      - name: Calendar search - weekend span and label alignment
        run: python tests/test_calendar_search.py

      # Eight overnight sessions in a row were terminated from outside and
      # not one left a record of why. The journal that fixes that must never
      # be able to end a session itself, so "it reports failure rather than
      # raising" is checked here rather than trusted.
      - name: Crash journal and console guard
        run: python tests/test_crash_report.py

      # The audit's first critical finding: two paths to a broker, and the
      # safety machinery on the one that had never traded. The properties
      # asserted are what CANNOT happen -- a live entry with no risk decision
      # is not sent, and a close is never refused by anything. On 3.10 the
      # risk engine genuinely cannot be imported, which is the interpreter
      # where "refuses rather than waves through" most needs proving.
      - name: The risk fence on the harness path
        run: python tests/test_risk_gate.py

      # PROJECT_STATE.json drifted from the database on six counts while it was
      # hand-written. This checks that it still says where its figures came
      # from, and that the generator reports an unreachable database as absent
      # rather than as zero.
      - name: Project state is measured, not remembered
        run: python tests/test_project_state.py

      - name: The single entry point dispatches where it says
        run: python tests/test_cli.py

      # A GAP in a session's pass ladder is the host having slept, and it is
      # the evidence Critical 1 turns on. Reading it used to mean eyeballing
      # a 160 KB log, which is how `overnight-20260915-201059` was recorded
      # as a session that reached its deadline while 112 minutes of it were
      # inside a gap.
      - name: A gap in the pass ladder is measured, not eyeballed
        run: python tests/test_session_gaps.py

  # Platform backend (L02+). Unit tests only: nothing here needs Postgres,
  # Redis or an MT5 terminal, and readiness checks are proven honest against
  # a closed port rather than a running service.
  backend:
    runs-on: ubuntu-latest
    name: backend (lint, types, tests)
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  # ------------------------------------------------------------ PostgreSQL
  # The suite runs on in-memory SQLite, which has two blind spots that have
  # both drawn blood: foreign keys are OFF unless a pragma is issued per
  # connection, and the 27 Alembic revisions that build production's schema
  # are exercised by NOTHING -- every test calls create_all instead. So a
  # model can drift from its migration indefinitely while the suite stays
  # green, and a route can write a dangling reference and pass 174 API tests
  # before failing on the real database, which is exactly what POST /v1/orders
  # did on 2026-09-07.
  #
  # This job is small on purpose. It does not re-run the suite against
  # PostgreSQL -- 49 test files hardcode a SQLite URL, and changing them all
  # is a wider job than this. It runs the checks SQLite CANNOT do.
  postgres:
    runs-on: ubuntu-latest
    name: postgres (migrations, schema parity, foreign keys)
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tr
          POSTGRES_PASSWORD: tr
          POSTGRES_DB: tr_ci
        ports:
          - 5432:5432
        # Without the health check the first step can beat the server to
        # ready and fail on connection refused rather than on anything real.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Migrations, schema parity and referential integrity
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://tr:tr@127.0.0.1:5432/tr_ci
        run: python -m pytest tests/test_postgres_schema.py -v

      # A skip here would be silent success: the tests skip when
      # POSTGRES_TEST_URL is unset, so a broken env would turn this whole
      # job green without checking anything.
      - name: Verify the checks actually ran
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://tr:tr@127.0.0.1:5432/tr_ci
        run: |
          python -m pytest tests/test_postgres_schema.py -q 2>&1 | tee out.txt
          grep -qE '[0-9]+ passed' out.txt || { echo 'nothing passed'; exit 1; }
          grep -q 'skipped' out.txt && { echo 'tests skipped; the URL did not take'; exit 1; }
          echo 'postgres checks ran'

  # Platform frontend (L02+).
  frontend:
    runs-on: ubuntu-latest
    name: frontend (lint, types, tests, build)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # ------------------------------------------------------------------ L41
  # Images. This job BUILDS and VERIFIES; it does not push and it does not
  # deploy, because this repository has no registry and no target, and a
  # pipeline that pretends to deploy is worse than one that does not try.
  #
  # `needs:` is the gate the brief asks for -- the image is not built unless
  # lint, types and tests have passed on both halves. "Do not deploy if
  # critical tests fail" is enforced by the dependency graph rather than by a
  # step somebody can reorder.
  images:
    runs-on: ubuntu-latest
    name: images (build, stamp, verify)
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Stamp
        id: stamp
        run: |
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # A tag build releases its tag; anything else releases a short SHA.
          # Never `latest`: an image tagged only `latest` overwrites the thing
          # you would roll back to, which is the gap the L41 audit found.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build backend image
        run: |
          docker build -f backend/Dockerfile \
            --build-arg GIT_COMMIT='${{ steps.stamp.outputs.commit }}' \
            --build-arg BUILD_TIME='${{ steps.stamp.outputs.built }}' \
            --build-arg RELEASE_VERSION='${{ steps.stamp.outputs.version }}' \
            -t "tr-api:${{ steps.stamp.outputs.version }}" .

      - name: Build frontend image
        run: docker build -t "tr-frontend:${{ steps.stamp.outputs.version }}" ./frontend

      # The image must be able to say what it is. An unstamped image cannot be
      # confirmed as deployed and cannot be rolled back to, so a build that
      # loses its stamp fails here rather than on a production host.
      - name: Verify the image is stamped and can identify itself
        run: |
          docker run --rm "tr-api:${{ steps.stamp.outputs.version }}" python -c "
          import json, sys
          from app.core.release import describe
          from app.core.settings import Settings
          info = describe(Settings())
          print(json.dumps(info))
          assert info['stamped'], 'image is not stamped'
          assert info['schema_head'] != 'unknown', 'image cannot read its migration head'
          "

      # The reason the build context is the repository root rather than
      # backend/: app/strategies/indicators.py loads tools/rule_backtest.py and
      # tools/rule_search.py at call time. An image missing them passes every
      # health check and fails on the first backtest, so it is checked here.
      - name: Verify the research toolkit is present and importable
        run: |
          docker run --rm "tr-api:${{ steps.stamp.outputs.version }}" python -c "
          from app.strategies import indicators
          for name in ('rule_backtest', 'rule_search'):
              indicators._toolkit(name)
          print('toolkit ok')
          "

      # Every module, imported. Catches a dependency that is declared in the
      # development requirements and absent from the image.
      - name: Verify every application module imports inside the image
        run: |
          docker run --rm "tr-api:${{ steps.stamp.outputs.version }}" python -c "
          import importlib, pkgutil, app, sys
          bad = []
          for m in pkgutil.walk_packages(app.__path__, 'app.'):
              try: importlib.import_module(m.name)
              except Exception as e: bad.append((m.name, repr(e)))
          for b in bad: print(b, file=sys.stderr)
          sys.exit(1 if bad else 0)
          "

      - name: Verify the image runs as a non-root user
        run: |
          uid=$(docker run --rm "tr-api:${{ steps.stamp.outputs.version }}" id -u)
          test "$uid" != "0" || { echo "image runs as root"; exit 1; }
          echo "uid=$uid"

      # Compose must remain valid, and production must not publish a datastore.
      - name: Verify compose configurations
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          REDIS_PASSWORD: ci
          DATABASE_URL: postgresql+asyncpg://ci:ci@postgres:5432/ci
          REDIS_URL: redis://redis:6379/0
          CORS_ORIGINS: https://example.invalid
          TLS_CERT_DIR: ./nginx
          TR_SERVER_NAME: example.invalid
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          python - <<'PY'
          import subprocess, yaml, sys
          out = subprocess.run(
              ["docker","compose","-f","docker-compose.yml","-f","docker-compose.prod.yml","config"],
              capture_output=True, text=True, check=True).stdout
          services = yaml.safe_load(out)["services"]
          published = {
              name: [p.get("published") for p in svc.get("ports", [])]
              for name, svc in services.items()
          }
          # Only nginx may publish, and only 80 and 443. The datastores and the
          # API must be unreachable from the host in production.
          bad = {n: p for n, p in published.items() if p and n != "nginx"}
          assert not bad, f"production publishes host ports for {bad}"
          assert sorted(published["nginx"]) == ["443", "80"], published["nginx"]
          print("production publishes only nginx 80/443")
          PY
